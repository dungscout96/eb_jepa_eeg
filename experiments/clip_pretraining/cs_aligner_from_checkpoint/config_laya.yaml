# cs_aligner fine-tune warm-started from the Laya JEPA checkpoint
# (experiments/jepa_pretraining/laya, jul10 H200 bs=64 seed=2025).
#
# Encoder shape MUST match the Laya JEPA checkpoint exactly (encoder_embed_dim=384,
# depth=12, heads=6, head_dim=64, patch_size=25, patch_overlap=0). See
# config_lejepa.yaml header for design notes; only encoder shape and
# proj_dim differ.

meta:
  seed: 2025
  device: auto
  encoder_init_from: null  # patched by _submit.py to the JEPA checkpoint path

data:
  batch_size: 64
  num_workers: 4
  task: ThePresent
  n_windows: 1
  window_size_seconds: 2       # must match JEPA config
  temporal_stride: 1
  preprocessed: true
  preprocessed_dir: null
  norm_mode: per_recording
  add_envelope: false
  corrca_filters: null
  annotation_duration_tolerance_s: 1.0
  max_recording_overshoot_s: 60.0
  channel_dropout_p: 0.0

model:
  # Laya encoder shape (from experiments/jepa_pretraining/laya/config.yaml).
  encoder_embed_dim: 384
  encoder_depth: 12
  encoder_heads: 6
  encoder_head_dim: 64
  patch_size: 25
  patch_overlap: 0
  freqs: 4
  mlp_dim_ratio: 2.66

loss:
  mode: cs_aligner
  mean_center: true
  target_kind: per_window
  temporal_buffer_s: 2.0

  cs_weight: 1.0
  kernel_bandwidth: null

  vision_passthrough: false
  proj_dim: 384                 # match encoder_embed_dim
  temperature: 0.07
  drop_proj: 0.5
  n_residual_blocks: 1

optim:
  optimizer: adamw
  weight_decay: 0.05
  epochs: 100
  lr: 1.0e-5
  lr_min: 1.0e-7
  warmup_epochs: 10

logging:
  log_wandb: true
  wandb_group: cs_aligner_from_jepa
  log_every: 1
  save_every: 20
  tqdm_silent: false

eval:
  auto_run: false
  n_passes: 20
  probe_seed: 42
  n_bootstrap: 2000
  feature_names:
    - contrast_rms
    - luminance_mean
    - position_in_movie
    - narrative_event_score
  visual_processing_delay_s: 0.0
  val_every: 1
  val_recording_fraction: 0.1
  val_max_windows: 2000
