# cs_aligner fine-tune warm-started from the LeJEPA JEPA checkpoint
# (experiments/jepa_pretraining/lejepa_reve, jul10 H200 bs=64 seed=2025).
#
# Encoder shape MUST match the JEPA checkpoint exactly (encoder_embed_dim=512,
# depth=12, heads=8, head_dim=64, patch_size=50, patch_overlap=20). If any of
# these diverge, encoder_init_from silently drops mismatched keys via
# strict=False loading. See sibling soft_target_clip_from_jepa_checkpoint
# configs for the same design rationale.
#
# Loss: cs_aligner (Yin et al. 2025, arXiv:2502.17028) — L = L_InfoNCE + λ·D_CS
# on batch marginals to attack the modality gap that pairwise InfoNCE alone
# can't close. Paper default cs_weight=1.0; jul9 TP-only 400 ep sweep showed
# cs_weight=0 (vanilla CLIP) narrowly wins on val-CV probe, but this config
# uses the paper default so warm-start numbers are directly comparable to
# both the paper and the from-scratch cs_aligner runs in RESULTS_jul9.md.
#
# Optimizer follows config/clip_pretrain_from_reve.yaml's warm-start pattern:
# lr=1e-5 (1/10 of from-scratch), warmup=10, AdamW + wd=0.05.
#
# meta.encoder_init_from is intentionally null here — patch it in the submit
# script per-cluster / per-run so the on-disk template stays clean.

meta:
  seed: 2025
  device: auto
  encoder_init_from: null  # patched by _submit.py to the JEPA checkpoint path

data:
  batch_size: 64
  num_workers: 4
  task: ThePresent
  n_windows: 1
  window_size_seconds: 2       # must match JEPA config
  temporal_stride: 1
  preprocessed: true
  preprocessed_dir: null
  norm_mode: per_recording
  add_envelope: false
  corrca_filters: null
  annotation_duration_tolerance_s: 1.0
  max_recording_overshoot_s: 60.0
  channel_dropout_p: 0.0

model:
  # LeJEPA encoder shape (from experiments/jepa_pretraining/lejepa_reve/config.yaml).
  encoder_embed_dim: 512
  encoder_depth: 12
  encoder_heads: 8
  encoder_head_dim: 64
  patch_size: 50
  patch_overlap: 20
  freqs: 4
  mlp_dim_ratio: 2.66

loss:
  mode: cs_aligner
  mean_center: true
  target_kind: per_window
  temporal_buffer_s: 2.0

  # CS-Aligner knobs
  cs_weight: 1.0                # Yin et al. paper default. jul9 sweep tried
                                # {0, 0.001, 0.01, 0.05, 0.1, 1.0, 10.0} on
                                # from-scratch — cs_weight=0 marginally won.
                                # Keep 1.0 here for direct paper comparability.
  kernel_bandwidth: null        # null → median heuristic per batch (recommended)

  vision_passthrough: false
  proj_dim: 512                 # match encoder_embed_dim
  temperature: 0.07
  drop_proj: 0.5
  n_residual_blocks: 1

optim:
  optimizer: adamw
  weight_decay: 0.05
  epochs: 100                   # short warm-start default; bump for final runs
  lr: 1.0e-5                    # 1/10 of from-scratch — standard fine-tune
  lr_min: 1.0e-7
  warmup_epochs: 10             # longer warmup for warm-start

logging:
  log_wandb: true
  wandb_group: cs_aligner_from_jepa
  log_every: 1
  save_every: 20
  tqdm_silent: false

eval:
  auto_run: false               # probe run separately after training
  n_passes: 20
  probe_seed: 42
  n_bootstrap: 2000
  feature_names:
    - contrast_rms
    - luminance_mean
    - position_in_movie
    - narrative_event_score
  visual_processing_delay_s: 0.0
  val_every: 1
  val_recording_fraction: 0.1
  val_max_windows: 2000
